version: "1"

package:
  id: org.deepin.music
  name: "deepin-music"
  version: 7.0.68.1
  kind: app
  description: |
    music for deepin os.

base: org.deepin.base/25.2.2
# 解决 "Failed to initialize graphics backend for OpenGL."
runtime: org.deepin.runtime.webengine/6.7.0

command:
  - deepin-music

build: |
  # 修改路径
  sed -i "s|/usr|$PREFIX|g" src/libdmusic/CMakeLists.txt

  # 构建
  VERSION=$(head -1 debian/changelog | awk -F'[()]' '{print $2}')
  cmake -B build \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX=${PREFIX} \
      -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
      -DAPP_VERSION=${VERSION} \
      -DVERSION=${VERSION}
  cmake --build build -j`nproc`
  cmake --build build --target install > install.log 2>&1
  # update for libdmusic.so
  ldconfig -C "$LINGLONG_LD_SO_CACHE"

buildext:
  apt:
    build_depends:
      - cmake
      - pkg-config
      - libavutil-dev
      - libavcodec-dev
      - libavformat-dev
      - libicu-dev
      - libmpris-qt6-dev
      - libtag1-dev
      - libvlc-dev
      - libvlccore-dev
      - libsdl2-dev
    depends:
      - libvlc5
      - libvlccore9
      - vlc-plugin-base
      - libsdl2-2.0-0
      - libtag1v5
      - libmpris-qt6
      - libavcodec60
