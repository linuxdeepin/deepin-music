    - LrcBtn
- id: suite_音乐_界面操作_工具栏_006_s1
  name: '[032][core][acp1]工具栏-播放歌曲时从播放队列移除当前歌曲'
  description: ''
  steps:
  - action: mouse_click
    selector:
      name: ListBtn
      role: push button
  - action: mouse_right_click
    selector:
      name: PlaylistDelegate
      role: list item
  - action: dtk_context_menu
    selector:
      name: PlaylistDelegate
    items:
    - Delete
  assert_steps:
  - action: assert_element
    selector:
      name: PlaylistMenu
      role: menu
