  annotation:
    测试界面: 音乐-主菜单
    测试功能: '[005][smoke][acp1]主菜单-添加新歌单选项'
    case_id: case_1677053
    case_name: '[005][smoke][acp1]主菜单-添加新歌单选项'
    AT元素引用:
    - WindowTitlebar_Menu
    - Add playlist
    - PlaylistDelegate
teardown:
