    selector:
      name: PlaylistDelegate
      role: list item
  annotation:
    测试界面: 音乐-用户场景
    测试功能: '[acp2][音乐]检查音乐播放功能'
    case_id: case_1676597
    case_name: '[acp2][音乐]检查音乐播放功能'
    AT元素引用:
    - Add Songs
    - Play All
    - PlaylistDelegate
