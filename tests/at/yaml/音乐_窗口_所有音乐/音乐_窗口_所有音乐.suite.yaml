name: 音乐_窗口_所有音乐_suite
app: deepin-music
module: 音乐_窗口_所有音乐
setup:
- action: session_start
  command: deepin-music
  wait: 3.0
suites:
- id: suite_音乐_窗口_所有音乐_001_s1
  name: 播放队列同步-所有音乐-播放歌曲时从本地删除歌曲，播放队列同步减少歌曲
  description: ''
  steps:
  - action: mouse_click
    selector:
      name: Add Songs
      role: push button
  - action: file_dialog_select
    path: ${TEST_FILES_DIR}/test.mp3
  - action: mouse_click
    selector:
      name: Play All
      role: push button
  - action: mouse_right_click
    selector:
      name: ItemD
      role: list item
  - action: dtk_context_menu
    selector:
      name: ItemD
    items:
    - Delete from local disk
  assert_steps:
  - action: assert_element
    selector:
      name: ItemD
      role: list item
  annotation:
    测试界面: 音乐-所有音乐
    测试功能: 播放队列同步-所有音乐-播放歌曲时从本地删除歌曲，播放队列同步减少歌曲
    case_id: case_1678763
    case_name: 播放队列同步-所有音乐-播放歌曲时从本地删除歌曲，播放队列同步减少歌曲
    AT元素引用:
    - Add Songs
    - Play All
    - ItemD
    - MoreMenu_2
