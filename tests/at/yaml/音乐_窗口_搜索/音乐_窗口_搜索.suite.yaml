  - action: keyboard_hot_key
    key: ctrl+f
  - action: keyboard_type
    text: test
  - action: keyboard_press
    key: Enter
  - action: keyboard_press
    key: Escape
  assert_steps:
  - action: assert_element
    selector:
      name: TabArea
      role: page tab list
