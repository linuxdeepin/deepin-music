- id: '1677617'
  name: '[004][smoke][acp1]歌曲导入-初始界面添加歌曲路径'
  module: 歌曲导入
  status: active
  annotation: &id003
    测试界面: 主窗口-空状态占位区
    测试功能: 添加歌曲文件/添加歌曲目录
    前置条件: 应用已启动且歌曲库为空
    AT元素引用:
    - 添加歌曲
    - 添加歌曲目录
  steps:
  - step_type: action
    description: 1. 点击【添加歌曲路径】按钮
  - step_type: action
    description: 2. 在文管弹窗中选择任意含有音乐文件的目录
  - step_type: assert
    description: 3. 点击【确认】按钮
  - step_type: assert
    description: 1. 弹出文管添加窗口，只有音乐文件可以选择，其他文件为置灰状
  - step_type: assert
    description: 2. 选中的文件高亮展示
  - step_type: assert
    description: 3. 添加歌曲成功，音乐跳转到所有音乐页面并展示添加的歌曲（若文件较多，添加过程会有百分比展示）
