- id: '1678727'
  name: '[192][core][acp1]所有音乐-删除所有歌曲'
  module: 删除确认
  status: active
  annotation: &id002
    测试界面: 删除/移除确认弹窗
    测试功能: 全选删除歌曲后确认弹窗交互
    前置条件: 应用已启动且歌曲列表非空
    AT元素引用:
    - 删除
    - 取消
  steps:
  - step_type: action
    description: 1. 使用快捷键【Ctrl+A】
  - step_type: action
    description: 2. 使用快捷键【Delete】
  - step_type: assert
    description: 3. 点击【确认】删除按钮
  - step_type: assert
    description: 1. 选中所有歌曲
  - step_type: assert
    description: 2. 弹出确认删除弹窗
  - step_type: assert
    description: 3. 删除过程会有音乐从下至上滚动的动画效果，删除所有歌曲后音乐返回初始界面
