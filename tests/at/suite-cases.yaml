    AT元素引用:
    - 取消
  steps:
  - step_type: action
    description: 1. 点击主菜单中关于菜单
  - step_type: assert
    description: 2. 查看关于窗口内容
  - step_type: assert
    description: 1. 弹出关于窗口
  - step_type: assert
    description: 2. 显示应用名字、版本，添加开源信息等相关信息
